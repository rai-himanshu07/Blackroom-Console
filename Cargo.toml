[workspace]
resolver = "3"
members = [
    "crates/blackroom-core",
    "crates/blackroom-experiments",
    "crates/blackroom-gnome",
    "crates/blackroom-systest",
    "crates/gnome-session-agent",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.96"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
