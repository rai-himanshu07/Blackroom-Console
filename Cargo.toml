[workspace]
resolver = "3"
# Built on its own (libpam bindings need libclang, and their build script breaks when unified with
# the PipeWire bindings): see docs/ops/install-security.sh and docs/security/authentication.md.
exclude = ["crates/pam-auth-helper"]
members = [
    "crates/blackroom-cli",
    "crates/blackroom-console",
    "crates/blackroom-core",
    "crates/blackroom-store",
    "crates/blackroom-experiments",
    "crates/blackroom-gnome",
    "crates/blackroom-systest",
    "crates/gnome-session-agent",
    "crates/remote-hostd",
    "crates/remote-input-helper",
    "crates/remote-emergency-client",
    "crates/remote-emergencyd",
    "crates/remote-gateway",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.96"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
