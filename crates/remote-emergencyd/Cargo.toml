[package]
name = "remote-emergencyd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Independent physical-input grab holder and emergency chord observer (Phase 7/10); not installed or enabled"

[lints]
workspace = true

[dependencies]
blackroom-core = { version = "0.1.0", path = "../blackroom-core" }
clap = { version = "4.6.6", features = ["derive"] }
evdev = "0.13.2"
remote-emergency-client = { version = "0.1.0", path = "../remote-emergency-client" }
remote-hostd = { version = "0.1.0", path = "../remote-hostd" }
remote-input-helper = { version = "0.1.0", path = "../remote-input-helper" }
rustix = { version = "1.1.4", features = ["net", "fs", "process"] }

[dev-dependencies]
tempfile = "3.23.0"
