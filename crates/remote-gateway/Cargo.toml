[package]
name = "remote-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Explicit loopback-only offline simulation gateway for Blackroom Console"

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
blackroom-core = { version = "0.1.0", path = "../blackroom-core" }
ed25519-dalek = "3.0.0"
gnome-session-agent = { version = "0.1.0", path = "../gnome-session-agent" }
remote-hostd = { version = "0.1.0", path = "../remote-hostd" }
rustix = { version = "1.1.4", features = ["process", "net", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.23.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }