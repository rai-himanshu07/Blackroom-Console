[package]
name = "blackroom-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Owner-only, atomic, versioned secret files for Blackroom Console"

[lints]
workspace = true

[dependencies]
getrandom = "0.4.3"
hex = "0.4.3"
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zeroize = { version = "1.9.0", features = ["alloc"] }

[dev-dependencies]
tempfile = "3.23.0"
