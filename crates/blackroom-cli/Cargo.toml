[package]
name = "blackroom-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Operator CLI for the offline Blackroom Console state directory and the emergency daemon status"

[lints]
workspace = true

[[bin]]
name = "blackroom"
path = "src/main.rs"

[dependencies]
remote-emergencyd = { version = "0.1.0", path = "../remote-emergencyd" }
remote-hostd = { version = "0.1.0", path = "../remote-hostd" }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.23.0"
