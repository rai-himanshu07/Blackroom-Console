[package]
name = "blackroom-gnome"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "GnomeBackend trait, session discovery, capability detection, and in-memory fake for Blackroom Console."

[lints]
workspace = true

[dependencies]
blackroom-core = { version = "0.1.0", path = "../blackroom-core" }
rustix = { version = "1.1.4", features = ["process"] }
