[package]
name = "blackroom-gnome"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "GnomeBackend trait, session discovery, capability detection, and in-memory fake for Blackroom Console."

[lints]
workspace = true

[dependencies]
blackroom-core = { version = "0.1.0", path = "../blackroom-core" }
jpeg-encoder = "0.7.1"
pipewire = "0.10.1"
reis = "0.7.1"
rustix = { version = "1.1.4", features = ["event", "process", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tracing = "0.1.44"
zbus = "5.19.0"

[dev-dependencies]
ed25519-dalek = "3.0.0"
