[package]
name = "gnome-session-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "User-session agent (Doc 05 §16-17): discovers the GNOME session, runs the Phase 3 capability gate, and reports AgentState over agent.sock."

[lints]
workspace = true

[dependencies]
blackroom-core = { version = "0.1.0", path = "../blackroom-core" }
blackroom-gnome = { version = "0.1.0", path = "../blackroom-gnome" }
ed25519-dalek = "3.0.0"
hex = "0.4.3"
reis = "0.7.1"
remote-hostd = { version = "0.1.0", path = "../remote-hostd" }
serde_json = "1.0.151"
rustix = { version = "1.1.4", features = ["net", "event", "fs", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.23.0"
zbus = "5.19.0"
