[package]
name = "blackroom-experiments"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Document 10 feasibility experiments (read-only Phase 0-1, mutating from Phase 4) and shared evidence-reporting helpers (discardable)."

[dependencies]
anyhow = "1.0.104"
blackroom-core = { version = "0.1.0", path = "../blackroom-core" }
blackroom-gnome = { version = "0.1.0", path = "../blackroom-gnome" }
clap = { version = "4.6.6", features = ["derive"] }
evdev = "0.13.2"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
getrandom = "0.4.3"
pipewire = "0.10.1"
reis = "0.7.1"
remote-input-helper = { version = "0.1.0", path = "../remote-input-helper" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = "5.19.0"
