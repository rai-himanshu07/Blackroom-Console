[package]
name = "blackroom-console"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Remote console: browser view and input for this laptop's desktop while the local panel and input are isolated."

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
blackroom-core = { version = "0.1.0", path = "../blackroom-core" }
blackroom-gnome = { version = "0.1.0", path = "../blackroom-gnome" }
clap = { version = "4.6.6", features = ["derive"] }
rustix = { version = "1.1.4", features = ["process"] }
sha2 = "0.11.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
gstreamer = "0.25"
gstreamer-sdp = "0.25"
gstreamer-webrtc = { version = "0.25", features = ["v1_18"] }
rcgen = "0.14"
reis = "0.7.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
remote-emergency-client = { version = "0.1.0", path = "../remote-emergency-client" }
remote-hostd = { version = "0.1.0", path = "../remote-hostd" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = "5.19.0"
zeroize = { version = "1.9.0", features = ["alloc", "serde"] }

[dev-dependencies]
blackroom-store = { version = "0.1.0", path = "../blackroom-store" }
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }
