<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackroom Console login</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; color: #ddd; font: 16px system-ui, sans-serif; }
  form { display: flex; flex-direction: column; gap: 10px; width: min(340px, 92vw); }
  label { font-size: 13px; color: #aaa; }
  input, button { font: inherit; padding: 11px; border-radius: 6px; border: 1px solid #444; background: #1c1c1c; color: #eee; }
  button { background: #1a6b2a; border-color: #3c3; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row input[type=checkbox] { width: auto; }
  a { color: #8ab; font-size: 13px; cursor: pointer; }
  #msg { min-height: 1.4em; text-align: center; color: #f99; }
  #saved { font-size: 13px; color: #9c9; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <label>Account <input id="account" autocomplete="username" required></label>
  <label>Linux password <input id="password" type="password" autocomplete="current-password" required></label>
  <label>Authenticator code (or recovery code) <input id="code" inputmode="numeric" autocomplete="off" required></label>
  <div id="keybox">
    <label>Remote Access Key <input id="key" type="password" autocomplete="off"></label>
    <div class="row"><input id="trust" type="checkbox"><label for="trust">Trust this browser</label></div>
  </div>
  <div id="saved" hidden>This browser is trusted: no key needed. <a id="forget">Forget it</a></div>
  <button type="submit">Log in</button>
  <div id="msg"></div>
</form>
<script>
const $ = (id) => document.getElementById(id);
const DEVICE = "br_device", ACCOUNT = "br_account";
function device() { try { return JSON.parse(localStorage.getItem(DEVICE)); } catch (_) { return null; } }
function refresh() {
  const saved = device();
  $("saved").hidden = !saved;
  $("keybox").hidden = !!saved;
}
$("account").value = localStorage.getItem(ACCOUNT) || "";
refresh();
$("forget").addEventListener("click", () => { localStorage.removeItem(DEVICE); refresh(); });
$("f").addEventListener("submit", async (event) => {
  event.preventDefault();
  $("msg").textContent = "";
  const body = { account: $("account").value.trim(), password: $("password").value, code: $("code").value.trim() };
  const saved = device();
  if (saved) { body.device_id = saved.id; body.device_secret = saved.secret; }
  else {
    body.access_key = $("key").value;
    if ($("trust").checked) body.trust_label = (navigator.platform || "browser").slice(0, 30).replace(/[^A-Za-z0-9 _.-]/g, "") || "browser";
  }
  try {
    const response = await fetch("/login", { method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (response.ok) {
      localStorage.setItem(ACCOUNT, body.account);
      const reply = await response.json().catch(() => ({}));
      if (reply.device_id && reply.device_secret) localStorage.setItem(DEVICE, JSON.stringify({ id: reply.device_id, secret: reply.device_secret }));
      location.reload();
      return;
    }
    const reply = await response.json().catch(() => ({}));
    $("msg").textContent =
      response.status === 429 ? "Too many attempts. Wait and try again."
      : response.status === 503 ? "Remote access is disabled or the login service is not running."
      : reply.code === "AUTH_TOTP_REQUIRED" ? "Enter the authenticator code."
      : reply.code === "AUTH_ACCESS_KEY_REQUIRED" ? "Enter the Remote Access Key."
      : "Login refused.";
  } catch (_) { $("msg").textContent = "No connection."; }
  $("password").value = ""; $("code").value = ""; $("key").value = "";
});
</script>
</body>
</html>
