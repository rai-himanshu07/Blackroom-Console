<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Blackroom Console</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 14px system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #bar { background: #181818; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button, select { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 8px 12px; font: inherit; touch-action: manipulation; }
  button.on { background: #1d5fb4; border-color: #5aa0ff; }
  #start { background: #1a6b2a; border-color: #3c3; }
  #stop { background: #8b1a1a; border-color: #d33; display: none; }
  #chip { margin-left: auto; opacity: .9; padding: 4px 8px; border-radius: 12px; background: #262626; white-space: nowrap; }
  #chip.live { background: #123d1b; color: #8f8; }
  #mods { display: none; }
  #stage { position: relative; flex: 1; min-height: 0; background: #000; }
  .media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none; touch-action: none; user-select: none; -webkit-user-select: none; cursor: none; background: #000; }
  #dot { position: fixed; width: 14px; height: 14px; margin: -7px 0 0 -7px; border: 2px solid #fff; border-radius: 50%; background: rgba(255,80,80,.6); pointer-events: none; display: none; z-index: 5; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; white-space: pre-line; pointer-events: none; }
  #msg.over { inset: auto 8px 8px 8px; background: rgba(0,0,0,.7); border-radius: 8px; padding: 8px 12px; justify-content: flex-start; }
  #kb { position: fixed; left: -100px; top: 0; width: 1px; height: 1px; opacity: 0; }
  #barToggle { position: fixed; top: 6px; right: 6px; z-index: 6; padding: 4px 10px; opacity: .6; }
  body.nobar #bar { display: none; }
</style>
</head>
<body>
<div id="bar">
  <div class="row">
    <button id="start">Start</button>
    <button id="stop">Stop</button>
    <select id="quality" title="Quality">
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>
    <select id="transport" title="Video transport">
      <option value="auto">Video: auto</option>
      <option value="mjpeg">Video: MJPEG</option>
    </select>
    <button id="full">Fullscreen</button>
    <span id="chip">idle</span>
  </div>
  <div class="row" id="mods">
    <button data-mod="ControlLeft">Ctrl</button>
    <button data-mod="AltLeft">Alt</button>
    <button data-mod="ShiftLeft">Shift</button>
    <button data-mod="MetaLeft">Super</button>
    <button data-tap="Escape">Esc</button>
    <button data-tap="Tab">Tab</button>
    <button data-tap="ArrowLeft">&larr;</button>
    <button data-tap="ArrowUp">&uarr;</button>
    <button data-tap="ArrowDown">&darr;</button>
    <button data-tap="ArrowRight">&rarr;</button>
    <button id="mode">Trackpad</button>
    <button id="rclick">Right-click</button>
    <button id="kbbtn">Keyboard</button>
  </div>
</div>
<button id="barToggle" title="Hide or show the controls">&#9650;</button>
<div id="stage">
  <img id="mjpeg" class="media" alt="remote desktop" draggable="false">
  <video id="rtc" class="media" autoplay muted playsinline></video>
  <div id="msg">Press Start. The laptop screen goes blank and its keyboard and touchpad stop working until you press Stop.</div>
</div>
<div id="dot"></div>
<input id="kb" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
<script>
"use strict";
// Linux evdev codes by KeyboardEvent.code (US layout positions).
const CODES = {
  Escape: 1, Digit1: 2, Digit2: 3, Digit3: 4, Digit4: 5, Digit5: 6, Digit6: 7, Digit7: 8, Digit8: 9, Digit9: 10, Digit0: 11,
  Minus: 12, Equal: 13, Backspace: 14, Tab: 15, KeyQ: 16, KeyW: 17, KeyE: 18, KeyR: 19, KeyT: 20, KeyY: 21, KeyU: 22, KeyI: 23,
  KeyO: 24, KeyP: 25, BracketLeft: 26, BracketRight: 27, Enter: 28, ControlLeft: 29, KeyA: 30, KeyS: 31, KeyD: 32, KeyF: 33,
  KeyG: 34, KeyH: 35, KeyJ: 36, KeyK: 37, KeyL: 38, Semicolon: 39, Quote: 40, Backquote: 41, ShiftLeft: 42, Backslash: 43,
  KeyZ: 44, KeyX: 45, KeyC: 46, KeyV: 47, KeyB: 48, KeyN: 49, KeyM: 50, Comma: 51, Period: 52, Slash: 53, ShiftRight: 54,
  NumpadMultiply: 55, AltLeft: 56, Space: 57, CapsLock: 58, F1: 59, F2: 60, F3: 61, F4: 62, F5: 63, F6: 64, F7: 65, F8: 66,
  F9: 67, F10: 68, NumLock: 69, ScrollLock: 70, Numpad7: 71, Numpad8: 72, Numpad9: 73, NumpadSubtract: 74, Numpad4: 75,
  Numpad5: 76, Numpad6: 77, NumpadAdd: 78, Numpad1: 79, Numpad2: 80, Numpad3: 81, Numpad0: 82, NumpadDecimal: 83,
  IntlBackslash: 86, F11: 87, F12: 88, NumpadEnter: 96, ControlRight: 97, NumpadDivide: 98, PrintScreen: 99, AltRight: 100,
  Home: 102, ArrowUp: 103, PageUp: 104, ArrowLeft: 105, ArrowRight: 106, End: 107, ArrowDown: 108, PageDown: 109,
  Insert: 110, Delete: 111, MetaLeft: 125, MetaRight: 126, ContextMenu: 127,
};
// Soft-keyboard text: US layout characters to [KeyboardEvent.code, shift].
const CHARS = (() => {
  const map = {};
  for (const c of "abcdefghijklmnopqrstuvwxyz") { map[c] = ["Key" + c.toUpperCase(), false]; map[c.toUpperCase()] = ["Key" + c.toUpperCase(), true]; }
  "1234567890".split("").forEach((c) => { map[c] = ["Digit" + c, false]; });
  "!@#$%^&*()".split("").forEach((c, i) => { map[c] = ["Digit" + "1234567890"[i], true]; });
  const pairs = [["-", "_", "Minus"], ["=", "+", "Equal"], ["[", "{", "BracketLeft"], ["]", "}", "BracketRight"],
    ["\\", "|", "Backslash"], [";", ":", "Semicolon"], ["'", "\"", "Quote"], [",", "<", "Comma"], [".", ">", "Period"],
    ["/", "?", "Slash"], ["`", "~", "Backquote"]];
  for (const [plain, shifted, code] of pairs) { map[plain] = [code, false]; map[shifted] = [code, true]; }
  map[" "] = ["Space", false];
  return map;
})();
const BTN = { 0: 0x110, 1: 0x112, 2: 0x111 };
const IDLE_TEXT = "Press Start. The laptop screen goes blank and its keyboard and touchpad stop working until you press Stop.";

const $ = (id) => document.getElementById(id);
const mjpeg = $("mjpeg"), rtcVideo = $("rtc"), chip = $("chip"), msg = $("msg"), mods = $("mods");
let running = false;
let remote = { w: 1920, h: 1080 };
let queue = [];
let flushing = false;
const heldKeys = new Set();
const heldButtons = new Set();
const stickyMods = new Set();
let rightClickNext = false;

function say(text, overlay) { msg.textContent = text; msg.className = overlay ? "over" : ""; msg.style.display = text ? "flex" : "none"; }

async function post(path, body) {
  return fetch(path, {
    method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
}

// ---- video: WebRTC H.264 first, MJPEG as the fallback ----
let pc = null, inputChannel = null, usingRtc = false, videoStarted = false, statsTimer = null, lastStats = null, statsText = "", transportNote = "";

function surface() { return usingRtc ? rtcVideo : mjpeg; }

function contentRect() {
  const r = surface().getBoundingClientRect();
  const aspect = remote.w / remote.h;
  let w = r.width, h = r.height;
  if (w / h > aspect) w = h * aspect; else h = w / aspect;
  return { left: r.left + (r.width - w) / 2, top: r.top + (r.height - h) / 2, width: w, height: h };
}

function closeRtc() {
  inputChannel = null;
  if (pc) { pc.onconnectionstatechange = null; pc.close(); pc = null; }
  rtcVideo.srcObject = null; rtcVideo.style.display = "none";
  usingRtc = false;
}

function startMjpeg() {
  closeRtc();
  mjpeg.style.display = "block";
  mjpeg.src = "/video?" + Date.now();
  statsText = "MJPEG";
  placeDot();
}

function stopVideo() {
  closeRtc();
  mjpeg.removeAttribute("src"); mjpeg.style.display = "none";
  clearInterval(statsTimer); statsTimer = null; lastStats = null; statsText = "";
}

function waitFor(predicate, ms) {
  return new Promise((resolve, reject) => {
    const started = performance.now();
    const tick = () => {
      if (predicate()) resolve();
      else if (performance.now() - started > ms) reject(new Error("timed out"));
      else setTimeout(tick, 50);
    };
    tick();
  });
}

async function startWebRtc() {
  const peer = new RTCPeerConnection({ iceServers: [] });
  pc = peer;
  peer.addTransceiver("video", { direction: "recvonly" });
  const channel = peer.createDataChannel("input");
  channel.onopen = () => { if (pc === peer) inputChannel = channel; };
  channel.onclose = () => { if (inputChannel === channel) inputChannel = null; };
  peer.ontrack = (event) => {
    rtcVideo.srcObject = event.streams[0] || new MediaStream([event.track]);
    try { event.receiver.playoutDelayHint = 0; event.receiver.jitterBufferTarget = 0; } catch (_) { /* optional */ }
  };
  await peer.setLocalDescription(await peer.createOffer());
  await waitFor(() => peer.iceGatheringState === "complete", 2500).catch(() => {});
  const response = await post("/webrtc", { sdp: peer.localDescription.sdp });
  const body = await response.json();
  if (!response.ok) throw new Error(body.error || response.status);
  await peer.setRemoteDescription({ type: "answer", sdp: body.sdp });
  await waitFor(() => peer.connectionState === "connected", 8000);
  await waitFor(() => rtcVideo.videoWidth > 0, 8000);
  if (pc !== peer) return;
  usingRtc = true;
  mjpeg.removeAttribute("src"); mjpeg.style.display = "none";
  rtcVideo.style.display = "block";
  rtcVideo.play().catch(() => {});
  peer.onconnectionstatechange = () => {
    if (pc === peer && (peer.connectionState === "failed" || peer.connectionState === "closed") && running) {
      transportNote = "WebRTC dropped; using MJPEG."; startMjpeg();
    }
  };
  placeDot();
}

async function connectVideo() {
  transportNote = "";
  if (window.RTCPeerConnection && $("transport").value !== "mjpeg") {
    try { await startWebRtc(); return; }
    catch (error) { closeRtc(); transportNote = "WebRTC unavailable (" + error.message + "); using MJPEG."; }
  }
  startMjpeg();
}

async function sampleStats() {
  if (!usingRtc || !pc) { return; }
  const report = await pc.getStats();
  let inbound = null;
  report.forEach((entry) => { if (entry.type === "inbound-rtp" && entry.kind === "video") inbound = entry; });
  if (!inbound) return;
  const now = performance.now();
  if (lastStats) {
    const seconds = (now - lastStats.t) / 1000;
    const fps = (inbound.framesDecoded - lastStats.frames) / seconds;
    const mbit = ((inbound.bytesReceived - lastStats.bytes) * 8 / 1e6) / seconds;
    statsText = `WebRTC ${fps.toFixed(0)} fps ${mbit.toFixed(1)} Mbit/s`;
  }
  lastStats = { t: now, frames: inbound.framesDecoded, bytes: inbound.bytesReceived };
}

// ---- input ----
function send(event) {
  if (!running) return;
  if (event.t === "move" && queue.length && queue[queue.length - 1].t === "move") queue[queue.length - 1] = event;
  else queue.push(event);
  flush();
}

// Data channel while it is open, HTTP otherwise (and when a send fails).
async function sendInput(batch) {
  const channel = inputChannel;
  if (channel && channel.readyState === "open") {
    try { channel.send(JSON.stringify(batch)); return { status: 204 }; }
    catch (_) { inputChannel = null; }
  }
  return post("/input", batch);
}

async function flush() {
  if (flushing) return;
  flushing = true;
  try {
    while (queue.length && running) {
      const batch = queue; queue = [];
      const response = await sendInput(batch);
      if (response.status === 409) { await refresh(); }
    }
  } catch (_) { /* the heartbeat decides when the link is lost */ }
  flushing = false;
}

function keyEvent(code, down) {
  const evdev = CODES[code];
  if (evdev === undefined) return;
  if (down) heldKeys.add(evdev); else heldKeys.delete(evdev);
  send({ t: "key", code: evdev, down });
}

function tap(code) { keyEvent(code, true); keyEvent(code, false); }

function releaseAll() {
  touches.clear(); gesture = null; scrollLast = null;
  for (const code of [...heldKeys]) send({ t: "key", code, down: false });
  for (const code of [...heldButtons]) send({ t: "button", code, down: false });
  heldKeys.clear(); heldButtons.clear(); stickyMods.clear();
  mods.querySelectorAll("[data-mod]").forEach((b) => b.classList.remove("on"));
}

function position(event) {
  const r = contentRect();
  return { x: Math.min(1, Math.max(0, (event.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (event.clientY - r.top) / r.height)) };
}

// Mouse maps directly. Touch has two modes: "trackpad" (drag moves the cursor like a laptop touchpad) and "touch"
// (direct). Both: tap = click, two-finger tap = right click, two-finger drag = scroll, tap then drag = drag.
let touchMode = localStorage.getItem("touchMode") === "touch" ? "touch" : "trackpad";
const cursor = { x: 0.5, y: 0.5 };
const touches = new Map();
let gesture = null;
let lastTapEnd = 0;
let scrollLast = null;
const TAP_MS = 350, MOVE_PX = 6, SCROLL_GAIN = 3, TRACKPAD_GAIN = 1.6;

function clamp01(v) { return Math.min(1, Math.max(0, v)); }
function placeDot() {
  const dot = $("dot");
  if (!running || touchMode !== "trackpad") { dot.style.display = "none"; return; }
  const r = contentRect();
  dot.style.left = (r.left + cursor.x * r.width) + "px";
  dot.style.top = (r.top + cursor.y * r.height) + "px";
  dot.style.display = "block";
}
function setCursor(x, y) {
  cursor.x = clamp01(x); cursor.y = clamp01(y);
  send({ t: "move", x: cursor.x, y: cursor.y });
  placeDot();
}
function click(code) { send({ t: "button", code, down: true }); send({ t: "button", code, down: false }); }
function press(code) { heldButtons.add(code); send({ t: "button", code, down: true }); }
function release(code) { if (heldButtons.delete(code)) send({ t: "button", code, down: false }); }
function setMode(mode) {
  touchMode = mode; localStorage.setItem("touchMode", mode);
  $("mode").textContent = mode === "trackpad" ? "Trackpad" : "Touch";
  placeDot();
}

function onSurface(type, handler, options) {
  mjpeg.addEventListener(type, handler, options);
  rtcVideo.addEventListener(type, handler, options);
}

onSurface("pointerdown", (event) => {
  if (!running) return;
  event.currentTarget.setPointerCapture(event.pointerId);
  event.preventDefault();
  if (event.pointerType === "mouse") {
    const p = position(event); setCursor(p.x, p.y);
    if (BTN[event.button]) press(BTN[event.button]);
    return;
  }
  touches.set(event.pointerId, { x: event.clientX, y: event.clientY, startX: event.clientX, startY: event.clientY });
  const now = performance.now();
  if (touches.size === 1) {
    gesture = { moved: false, pressed: false, multi: false, twoMoved: false, start: now, twoStart: 0, longPress: null };
    if (touchMode === "touch") { const p = position(event); setCursor(p.x, p.y); }
    if (now - lastTapEnd < 300) { gesture.pressed = true; press(0x110); }
    else if (touchMode === "touch") {
      gesture.longPress = setTimeout(() => {
        if (gesture && !gesture.moved && !gesture.multi) { gesture.consumed = true; click(0x111); }
      }, 600);
    }
  } else if (gesture) {
    clearTimeout(gesture.longPress);
    if (gesture.pressed) { release(0x110); gesture.pressed = false; }
    gesture.multi = true; gesture.twoStart = now; scrollLast = null;
  }
});

onSurface("pointermove", (event) => {
  if (!running) return;
  if (event.pointerType === "mouse") { const p = position(event); setCursor(p.x, p.y); return; }
  const t = touches.get(event.pointerId);
  if (!t || !gesture) return;
  const dx = event.clientX - t.x, dy = event.clientY - t.y;
  t.x = event.clientX; t.y = event.clientY;
  if (touches.size === 1 && !gesture.multi) {
    if (!gesture.moved && Math.hypot(event.clientX - t.startX, event.clientY - t.startY) < MOVE_PX) return;
    gesture.moved = true;
    clearTimeout(gesture.longPress);
    if (touchMode === "touch") {
      if (!gesture.pressed) { gesture.pressed = true; press(0x110); }
      const p = position(event); setCursor(p.x, p.y);
    } else {
      const r = contentRect();
      setCursor(cursor.x + dx / r.width * TRACKPAD_GAIN, cursor.y + dy / r.height * TRACKPAD_GAIN);
    }
  } else if (touches.size === 2) {
    const pts = [...touches.values()];
    const ax = (pts[0].x + pts[1].x) / 2, ay = (pts[0].y + pts[1].y) / 2;
    if (scrollLast !== null) {
      const sx = (scrollLast.x - ax) * SCROLL_GAIN, sy = (scrollLast.y - ay) * SCROLL_GAIN;
      if (sx || sy) { send({ t: "scroll", dx: sx, dy: sy }); gesture.twoMoved = true; }
    }
    scrollLast = { x: ax, y: ay };
  }
});

function pointerEnd(event) {
  if (event.pointerType === "mouse") {
    if (BTN[event.button]) release(BTN[event.button]);
    return;
  }
  touches.delete(event.pointerId);
  if (touches.size > 0 || !gesture) return;
  const g = gesture, now = performance.now();
  gesture = null; scrollLast = null;
  clearTimeout(g.longPress);
  if (g.pressed) { release(0x110); lastTapEnd = 0; if (g.moved) return; }
  if (g.consumed) return;
  if (g.multi) {
    if (!g.twoMoved && now - g.twoStart < TAP_MS) click(0x111);
  } else if (!g.moved && now - g.start < TAP_MS) {
    if (g.pressed) return;
    if (rightClickNext) { rightClickNext = false; $("rclick").classList.remove("on"); click(0x111); }
    else { click(0x110); lastTapEnd = now; }
  }
}
onSurface("pointerup", pointerEnd);
onSurface("pointercancel", pointerEnd);
onSurface("contextmenu", (event) => event.preventDefault());
onSurface("wheel", (event) => {
  if (!running) return;
  event.preventDefault();
  const unit = event.deltaMode === 1 ? 15 : event.deltaMode === 2 ? 300 : 1;
  send({ t: "scroll", dx: event.deltaX * unit, dy: event.deltaY * unit });
}, { passive: false });

// Hardware keyboard: everything goes to the laptop while a session runs.
window.addEventListener("keydown", (event) => {
  if (!running || CODES[event.code] === undefined) return;
  event.preventDefault();
  if (!event.repeat) keyEvent(event.code, true);
});
window.addEventListener("keyup", (event) => {
  if (!running || CODES[event.code] === undefined) return;
  event.preventDefault();
  keyEvent(event.code, false);
});

// Soft keyboard (tablets): characters arrive as text input, not as key events.
const kb = $("kb");
kb.addEventListener("beforeinput", (event) => {
  if (!running) return;
  event.preventDefault();
  if (event.inputType === "deleteContentBackward") tap("Backspace");
  else if (event.inputType === "insertLineBreak" || event.inputType === "insertParagraph") tap("Enter");
  else if (event.data) {
    for (const ch of event.data) {
      const entry = CHARS[ch];
      if (!entry) continue;
      if (entry[1]) keyEvent("ShiftLeft", true);
      tap(entry[0]);
      if (entry[1] && !stickyMods.has("ShiftLeft")) keyEvent("ShiftLeft", false);
    }
  }
});
$("kbbtn").addEventListener("click", () => { kb.focus(); });
// A focused button would swallow Space and Enter meant for the laptop.
$("bar").addEventListener("click", (event) => { if (event.target.tagName === "BUTTON" && event.target.id !== "kbbtn") event.target.blur(); });
$("bar").addEventListener("change", (event) => event.target.blur());

mods.querySelectorAll("[data-mod]").forEach((button) => {
  button.addEventListener("click", () => {
    const code = button.dataset.mod;
    const on = !stickyMods.has(code);
    if (on) stickyMods.add(code); else stickyMods.delete(code);
    button.classList.toggle("on", on);
    keyEvent(code, on);
  });
});
mods.querySelectorAll("[data-tap]").forEach((button) => button.addEventListener("click", () => tap(button.dataset.tap)));
$("mode").addEventListener("click", () => setMode(touchMode === "trackpad" ? "touch" : "trackpad"));
setMode(touchMode);
window.addEventListener("resize", placeDot);
$("rclick").addEventListener("click", () => { rightClickNext = !rightClickNext; $("rclick").classList.toggle("on", rightClickNext); });
window.addEventListener("blur", releaseAll);
document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAll(); });

// ---- controls ----
$("barToggle").addEventListener("click", () => {
  const hidden = document.body.classList.toggle("nobar");
  $("barToggle").innerHTML = hidden ? "&#9660;" : "&#9650;";
  setTimeout(placeDot, 50);
});

if (!document.fullscreenEnabled) $("full").style.display = "none";
$("full").addEventListener("click", async () => {
  if (document.fullscreenElement) { await document.exitFullscreen(); return; }
  await document.documentElement.requestFullscreen().catch(() => {});
  if (navigator.keyboard && navigator.keyboard.lock) navigator.keyboard.lock().catch(() => {});
  else transportNote = "Keyboard capture (Ctrl+W, Alt+Tab) needs https in Chrome or Edge.";
});
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock();
  setTimeout(placeDot, 100);
});

$("quality").value = localStorage.getItem("quality") || "medium";
$("quality").addEventListener("change", async () => {
  localStorage.setItem("quality", $("quality").value);
  await post("/quality", { level: $("quality").value }).catch(() => {});
});
$("transport").value = localStorage.getItem("transport") || "auto";
$("transport").addEventListener("change", () => {
  localStorage.setItem("transport", $("transport").value);
  if (running) { stopVideo(); connectVideo(); }
});

function show(state) {
  running = state.phase === "running";
  remote = { w: state.width || remote.w, h: state.height || remote.h };
  $("start").style.display = running ? "none" : "";
  $("stop").style.display = running ? "inline-block" : "none";
  mods.style.display = running ? "flex" : "none";
  chip.classList.toggle("live", running);
  if (document.activeElement !== $("quality")) $("quality").value = state.quality;
  if (running) {
    if (!videoStarted) {
      videoStarted = true;
      connectVideo();
      statsTimer = setInterval(async () => { try { await sampleStats(); } catch (_) { /* next tick */ } chip.textContent = `running ${statsText}`; }, 1000);
    }
    const notes = [...(state.notes || [])];
    if (transportNote) notes.push(transportNote);
    if (state.webrtc_error) notes.push("WebRTC: " + state.webrtc_error);
    say(notes.join("\n"), true);
    chip.textContent = `running ${statsText}`;
    placeDot();
  } else {
    if (videoStarted) { videoStarted = false; stopVideo(); }
    chip.textContent = state.phase;
    placeDot();
    const stop = state.last_stop;
    if (stop) say(`Stopped: ${stop.reason}\nDisplay restored: ${stop.topology_restored}. Session locked: ${stop.locked}.` + (stop.errors.length ? "\nProblems: " + stop.errors.join("; ") : ""));
    else if (state.phase === "idle") say(IDLE_TEXT);
  }
}

async function refresh() {
  try {
    const response = await fetch("/status", { credentials: "same-origin" });
    if (response.ok) show(await response.json());
    else if (response.status === 401) say("Not authorised: open the URL printed at start.");
  } catch (_) { chip.textContent = "no connection"; }
}

$("start").addEventListener("click", async () => {
  say("Starting...");
  $("start").disabled = true;
  try {
    await post("/quality", { level: $("quality").value });
    const response = await post("/start");
    const body = await response.json();
    if (!response.ok) say("Could not start: " + (body.error || response.status));
    else show(body);
  } catch (error) { say("Could not start: " + error); }
  $("start").disabled = false;
});

$("stop").addEventListener("click", async () => {
  releaseAll();
  await flush();
  running = false;
  say("Stopping...");
  try { await post("/stop"); } catch (_) { /* status below shows the outcome */ }
  await refresh();
});

// The laptop stops the session if this heartbeat is silent for 15 s.
setInterval(() => { if (running) sendInput([]).catch(() => {}); }, 2000);
setInterval(refresh, 2000);
refresh();
</script>
</body>
